<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tapeshot</title>
  <meta name="description" content="Measure anything from a photo. Put a sheet of paper or a card next to it, mark the corners, and tap the two ends. Works offline. No account, no tracking.">
  <meta name="theme-color" content="#f3f4f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b0c0e" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tapeshot">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app"></div>
  <div id="toasts" role="status" aria-live="polite"></div>
  <noscript><p style="padding:24px;font:18px sans-serif">Tapeshot needs JavaScript. Please turn it on in your browser settings.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
